[package]
name = "conversion-vault"
version = "0.1.0"
description = "Dr Fraudsworth Conversion Vault - Fixed-rate 100:1 token conversions"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.32.1", features = ["token_2022"] }
solana-security-txt = "1.1.1"

[dev-dependencies]
# LiteSVM integration tests live in tests-litesvm/ with their own lockfile (DEC-459);
# only what this crate's own #[cfg(test)] unit tests use stays here.
solana-program = "2.2"
spl-token-2022 = "8.0"

[features]
default = []
devnet = []
localnet = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[workspace]
members = [
    "programs/amm",
    "programs/conversion-vault",
    "programs/epoch-program",
    "programs/staking",
    "programs/tax-program",
    "programs/transfer-hook",
    "programs/vote-program",
]
resolver = "2"

# solana-verify selects its pinned build image from this (SBPFv3 builds need the 4.3.0 toolchain).
[workspace.metadata.cli]
solana = "4.3.0"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false

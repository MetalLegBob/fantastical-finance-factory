[package]
name = "tax-program"
version = "0.1.0"
description = "Dr Fraudsworth Tax Program - Asymmetric taxation and atomic distribution"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.32.1", features = ["token", "token_2022", "associated_token"] }
solana-security-txt = "1.1.1"

# AMM dependency for PoolState type and CPI
[dependencies.amm]
path = "../amm"
features = ["cpi"]

[dev-dependencies]
# LiteSVM integration tests live in tests-litesvm/ with their own lockfile (DEC-459);
# only what this crate's own #[cfg(test)] unit tests use stays here.
proptest = "1.9"
solana-program = "2.2"
spl-token = "8.0"
sha2 = "0.10"

[features]
default = []
# conversion-vault/devnet moved to tests-litesvm/tax-program: conversion-vault is only a test dependency (DEC-459).
devnet = ["amm/devnet"]
localnet = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[package]
name = "conversion-vault"
version = "0.1.0"
description = "Dr Fraudsworth Conversion Vault - Fixed-rate 100:1 token conversions"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.32.1", features = ["token_2022"] }
solana-security-txt = "1.1.1"

[dev-dependencies]
proptest = "1.9"
litesvm = "0.9.1"
solana-sdk = "2.2"
solana-program = "2.2"
spl-token-2022 = "8.0"
spl-associated-token-account = "7.0"
# Modular Solana 3.x crates needed for litesvm type compatibility (verbatim from tax-program)
solana-address = "2.0"
solana-keypair = "~3.1"
solana-signer = "~3.0"
solana-message = "~3.0"
solana-transaction = { version = "~3.0", features = ["verify"] }
solana-account = "3.3"
solana-instruction = "~3.1"
sha2 = "0.10"
# Transitive deps via transfer-hook/Cargo.toml — needed by tests/test_extract_profit.rs
# to seed the ExtraAccountMetaList PDA TLV layout (Phase 148-03 Task 2; Rule 3 deviation
# from plan's enumeration, see SUMMARY).
spl-discriminator = "0.4.1"
spl-tlv-account-resolution = "0.10.0"

[features]
default = []
devnet = []
localnet = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

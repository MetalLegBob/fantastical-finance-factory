[package]
name = "staking"
version = "0.1.0"
description = "Dr Fraudsworth Staking Program - PROFIT staking for SOL yield"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.32.1", features = ["token_2022"] }
solana-security-txt = "1.1.1"

[dev-dependencies]
# Only the dependencies this crate's own #[cfg(test)] unit tests use. Integration tests
# live in a separate workspace with their own lockfile.
sha2 = "0.10"
proptest = "1.9"
spl-token-2022 = "8.0.1"

[features]
default = []
devnet = []
test = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
